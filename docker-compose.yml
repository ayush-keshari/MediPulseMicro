services:

  # ── Database ────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-MediPulse@2024!Dev}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD:-MediPulse@2024!Dev}' -Q 'SELECT 1' -b -No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - medipulse

  # ── Migration Service ───────────────────────────────────────────────────────
  migrator:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - .:/src
    working_dir: /src
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo "Waiting for SQL Server to be ready..."
      # Wait for SQL Server to be ready
      for i in {1..30}; do
        if /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U SA -P "${SA_PASSWORD:-MediPulse@2024!Dev}" -Q "SELECT 1" 2>/dev/null; then
          echo "SQL Server is ready"
          break
        fi
        echo "Waiting for SQL Server to start..."
        sleep 2
      done

      echo "Running EF Core migrations for all services..."
      dotnet ef database update --project AuthService/AuthService.csproj
      dotnet ef database update --project FacilityService/FacilityService.csproj
      dotnet ef database update --project InventoryService/InventoryService.csproj
      dotnet ef database update --project ProcurementService/ProcurementService.csproj
      dotnet ef database update --project LogisticsService/LogisticsService.csproj
      dotnet ef database update --project TelemetryService/TelemetryService.csproj
      dotnet ef database update --project NotificationService/NotificationService.csproj
      dotnet ef database update --project AuditService/AuditService.csproj

      echo "Loading mock data..."
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U SA -P "${SA_PASSWORD:-MediPulse@2024!Dev}" -i MockData_InsertOnly.sql -d MedipulseMain

      echo "All migrations and data loading completed successfully!"
    networks:
      - medipulse

  # ── Backend services ─────────────────────────────────────────────────────────
  authservice:
    build:
      context: .
      dockerfile: AuthService/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${DB_NAME_MAIN:-MedipulseMain};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - ConnectionStrings__AuditConnection=Server=sqlserver,1433;Database=${DB_NAME_AUDIT:-MedipulseAudit};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-MediPulse@SuperSecretJWT_Key_2024!ForDev}
      - Jwt__Issuer=${JWT_ISSUER:-MediPulseAuthService}
      - Jwt__Audience=${JWT_AUDIENCE:-MediPulseAPI}
      - AuditService__BaseUrl=http://auditservice:8080
      - ServiceName=AuthService
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - medipulse

  facilityservice:
    build:
      context: .
      dockerfile: FacilityService/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${DB_NAME_MAIN:-MedipulseMain};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - ConnectionStrings__AuditConnection=Server=sqlserver,1433;Database=${DB_NAME_AUDIT:-MedipulseAudit};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-MediPulse@SuperSecretJWT_Key_2024!ForDev}
      - Jwt__Issuer=${JWT_ISSUER:-MediPulse}
      - Jwt__Audience=${JWT_AUDIENCE:-MediPulseUsers}
      - AuditService__BaseUrl=http://auditservice:8080
      - ServiceName=FacilityService
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - medipulse

  inventoryservice:
    build:
      context: .
      dockerfile: InventoryService/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${DB_NAME_MAIN:-MedipulseMain};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - ConnectionStrings__AuditConnection=Server=sqlserver,1433;Database=${DB_NAME_AUDIT:-MedipulseAudit};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-MediPulse@SuperSecretJWT_Key_2024!ForDev}
      - Jwt__Issuer=${JWT_ISSUER:-MediPulse}
      - Jwt__Audience=${JWT_AUDIENCE:-MediPulseUsers}
      - AuditService__BaseUrl=http://auditservice:8080
      - NotificationService__BaseUrl=http://notificationservice:8080
      - ServiceName=InventoryService
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - medipulse

  procurementservice:
