      context: .
      dockerfile: ProcurementService/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${DB_NAME_MAIN:-MedipulseMain};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - ConnectionStrings__AuditConnection=Server=sqlserver,1433;Database=${DB_NAME_AUDIT:-MedipulseAudit};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-MediPulse@SuperSecretJWT_Key_2024!ForDev}
      - Jwt__Issuer=${JWT_ISSUER:-MediPulse}
      - Jwt__Audience=${JWT_AUDIENCE:-MediPulseUsers}
      - AuditService__BaseUrl=http://auditservice:8080
      - NotificationService__BaseUrl=http://notificationservice:8080
      - ServiceName=ProcurementService
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - medipulse

  logisticsservice:
    build:
      context: .
      dockerfile: LogisticsService/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${DB_NAME_MAIN:-MedipulseMain};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - ConnectionStrings__AuditConnection=Server=sqlserver,1433;Database=${DB_NAME_AUDIT:-MedipulseAudit};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-MediPulse@SuperSecretJWT_Key_2024!ForDev}
      - Jwt__Issuer=${JWT_ISSUER:-MediPulse}
      - Jwt__Audience=${JWT_AUDIENCE:-MediPulseUsers}
      - AuditService__BaseUrl=http://auditservice:8080
      - NotificationService__BaseUrl=http://notificationservice:8080
      - ServiceName=LogisticsService
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - medipulse

  telemetryservice:
    build:
      context: .
      dockerfile: TelemetryService/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${DB_NAME_MAIN:-MedipulseMain};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - ConnectionStrings__AuditConnection=Server=sqlserver,1433;Database=${DB_NAME_AUDIT:-MedipulseAudit};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-MediPulse@SuperSecretJWT_Key_2024!ForDev}
      - Jwt__Issuer=${JWT_ISSUER:-MediPulse}
      - Jwt__Audience=${JWT_AUDIENCE:-MediPulseUsers}
      - AuditService__BaseUrl=http://auditservice:8080
      - ServiceName=TelemetryService
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
