  notificationservice:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${DB_NAME_MAIN:-MedipulseMain};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - ConnectionStrings__AuditConnection=Server=sqlserver,1433;Database=${DB_NAME_AUDIT:-MedipulseAudit};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-MediPulse@SuperSecretJWT_Key_2024!ForDev}
      - Jwt__Issuer=${JWT_ISSUER:-MediPulse}
      - Jwt__Audience=${JWT_AUDIENCE:-MediPulseUsers}
      - AuditService__BaseUrl=http://auditservice:8080
      - ServiceName=NotificationService
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - medipulse

  auditservice:
    build:
      context: .
      dockerfile: AuditService/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${DB_NAME_MAIN:-MedipulseMain};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - ConnectionStrings__AuditConnection=Server=sqlserver,1433;Database=${DB_NAME_AUDIT:-MedipulseAudit};User Id=sa;Password=${SA_PASSWORD:-MediPulse@2024!Dev};TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY:-MediPulse@SuperSecretJWT_Key_2024!ForDev}
      - Jwt__Issuer=${JWT_ISSUER:-MediPulse}
      - Jwt__Audience=${JWT_AUDIENCE:-MediPulseUsers}
      - ServiceName=AuditService
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - medipulse

  # ── Gateway ──────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - authservice
      - facilityservice
      - inventoryservice
      - procurementservice
      - logisticsservice
      - telemetryservice
      - notificationservice
      - auditservice
    networks:
      - medipulse

  # ── Frontend (Angular → nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - medipulse

  # ── SonarQube Code Analyzer ─────────────────────────────────────────────────
  sonarqube:
    image: sonarqube:lts-community
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - medipulse

networks:
  medipulse:
    driver: bridge

volumes:
  sqlserver_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: