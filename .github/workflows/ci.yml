name: CI/CD Pipeline

on:
  push:
    branches:
      - dev2
      - chore/improve-code-quality
      - main
  pull_request:
    branches:
      - dev2
      - chore/improve-code-quality
      - main

jobs:
  # Fast dbt validation catches broken project configuration before the
  # database-backed quality gate starts.
  dbt_parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipelines/dbt/requirements.txt

      - name: Install dbt project dependencies
        working-directory: pipelines/dbt
        run: dbt deps

      - name: Configure dbt profile
        run: |
          mkdir -p "$HOME/.dbt"
          cp pipelines/dbt/profiles.yml.example "$HOME/.dbt/profiles.yml"

      - name: Parse dbt project
        run: python pipelines/dbt/quality_gate.py --parse-only

      - name: Test quality gate failure handling
        run: python -m unittest discover -s pipelines/dbt/runner_tests -v

  # Backend build job - validates that the backend solution builds successfully
  backend_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Backend.slnx --use-lock-file

      - name: Verify NuGet lockfiles
        shell: bash
        run: |
          missing=0
          while IFS= read -r project; do
            lockfile="$(dirname "$project")/packages.lock.json"
            if [ ! -f "$lockfile" ]; then
              echo "Missing lockfile for $project"
              missing=1
            fi
          done < <(find . -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*')
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Every project has a packages.lock.json"

      - name: Build solution
        run: dotnet build Backend.slnx --no-restore --configuration Release

  # Frontend build job - validates that the frontend builds successfully
  frontend_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: Frontend

      - name: Build Angular app
        run: npm run build
        working-directory: Frontend

  # Backend test job - runs unit tests, coverage, formatting, and vulnerability checks
  backend_test:
    runs-on: ubuntu-latest
    needs: [backend_build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Backend.slnx --use-lock-file

      - name: Build solution
        run: dotnet build Backend.slnx --no-restore --configuration Release

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable || echo "No vulnerable packages check completed"

      - name: Install dotnet-format
        run: dotnet tool install --global dotnet-format

      - name: Verify .NET formatting
        run: dotnet format Backend.slnx --verify-no-changes

      - name: Run unit tests with coverage
        run: |
          dotnet test Backend.slnx --no-build --verbosity normal --configuration Release \
            --collect:"XPlat Code Coverage"

      - name: Report test coverage
        run: |
          # Install reportgenerator to convert cobertura to human-readable format
          dotnet tool install --global dotnet-reportgenerator-globaltool
          # Generate coverage report
          reportgenerator "-reports:**/TestResults/**/coverage.cobertura.xml" "-targetdir:TestResults/CoverageReport" "-reporttypes:TextSummary"
          # Extract coverage percentage from summary
          COVERAGE_PERCENT=$(awk '/Line coverage:/ {gsub(/%/, ""); print $NF}' TestResults/CoverageReport/Summary.txt)
          echo "Coverage: $COVERAGE_PERCENT%"
          # Ratchet the floor only after measuring coverage with unchanged exclusions.
          if [ "$(awk -v cov="$COVERAGE_PERCENT" 'BEGIN {print (cov < 37)}')" -eq 1 ]; then
            echo "Error: Coverage is below the required target of 37%"
            exit 1
          fi
          echo "Coverage gate passed: $COVERAGE_PERCENT% >= 37%"

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: TestResults/CoverageReport/
          if-no-files-found: warn
          retention-days: 14

  # Frontend test job - runs unit tests, linting, type checking, and vulnerability checks
  frontend_test:
    runs-on: ubuntu-latest
    needs: [frontend_build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: Frontend

      - name: Audit frontend dependencies
        # Build-tool advisories are reported separately; gate production dependencies here.
        run: npm audit --omit=dev --audit-level=high
        working-directory: Frontend

      - name: Run frontend unit tests
        run: npm test -- --watch=false
        working-directory: Frontend

      - name: TypeScript type checking
        run: npm run typecheck
        working-directory: Frontend

      - name: Lint code
        run: npm run lint
        working-directory: Frontend

      - name: Build Angular app (to ensure build works)
        run: npm run build
        working-directory: Frontend

  # Integration and data quality job - runs migrations and data quality checks against SQL Server
  integration_and_data_quality:
    runs-on: ubuntu-latest
    needs: [backend_build]  # Ensure backend builds successfully before running integration tests
    env:
      SA_PASSWORD: ${{ secrets.SA_PASSWORD || 'MediPulse@2024!Dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run isolated quality pipeline
        run: python pipelines/dbt/run_pipeline.py

      - name: Upload dbt quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-quality-artifacts
          path: pipelines/dbt/target/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run integration tests against isolated Compose stack
        run: |
          docker compose -f docker-compose.ci.yml down -v
          docker compose -f docker-compose.test.yml up -d --build --wait --wait-timeout 180
          for i in {1..60}; do
            if curl --fail --silent --show-error http://localhost:5000/health >/dev/null 2>&1; then
              echo "Gateway is ready"
              break
            fi
            echo "Waiting for the integration gateway..."
            sleep 5
          done
          curl --fail --silent --show-error http://localhost:5000/health >/dev/null
          # The root-owned migrator container writes obj/bin through the bind mount.
          # Restore runner ownership before the host executes IntegrationTests.
          sudo find . -type d \( -name obj -o -name bin \) -prune -exec chown -R "$(id -u):$(id -g)" {} +
          GATEWAY_BASE_URL=http://localhost:5000 dotnet test IntegrationTests/IntegrationTests.csproj \
            --configuration Release --logger "console;verbosity=minimal"

      - name: Tear down integration stack
        if: always()
        run: |
          docker compose -f docker-compose.test.yml ps
          docker compose -f docker-compose.test.yml logs --no-color --tail=200 migrator gateway
          docker compose -f docker-compose.test.yml down -v
          docker compose -f docker-compose.ci.yml down -v
