name: CI/CD Pipeline

on:
  push:
    branches:
      - dev2
      - chore/improve-code-quality
      - main
  pull_request:
    branches:
      - dev2
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore --use-lock-file

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Verify .NET formatting
      run: dotnet format --verify-no-changes

    - name: Run unit tests
      run: dotnet test --no-build --verbosity normal --configuration Release

    - name: Setup SQL Server for validation
      if: always()
      run: |
        # Install SQL Server tools
        wget -qO- https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        sudo add-apt-repository "$(wget -qO- https://packages.microsoft.com/config/ubuntu/22.04/mssql-server-2022.list)"
        sudo add-apt-repository "$(wget -qO- https://packages.microsoft.com/config/ubuntu/22.04/prod.list)"
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
        echo 'export PATH="$PATH:/opt/mssql-tools18/bin"' >> ~/.bashrc
        source ~/.bashrc

    - name: Start SQL Server
      if: always()
      run: |
        sudo /opt/mssql/bin/mssql-conf setup accept-eula
        sudo /opt/mssql/bin/mssql-conf set tcpport 1433
        sudo systemctl start mssql-server
        # Wait for SQL Server to start
        for i in {1..30}; do
          if /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "MediPulse@2024!Dev" -Q "SELECT 1" 2>/dev/null; then
            echo "SQL Server is ready"
            break
          fi
          echo "Waiting for SQL Server to start..."
          sleep 2
        done

    - name: Apply migrations and load mock data
      if: always()
      run: |
        # Run EF Core migrations
        dotnet ef database update --project AuthService/AuthService.csproj
        dotnet ef database update --project FacilityService/FacilityService.csproj
        dotnet ef database update --project InventoryService/InventoryService.csproj
        dotnet ef database update --project ProcurementService/ProcurementService.csproj
        dotnet ef database update --project LogisticsService/LogisticsService.csproj
        dotnet ef database update --project TelemetryService/TelemetryService.csproj
        dotnet ef database update --project NotificationService/NotificationService.csproj
        dotnet ef database update --project AuditService/AuditService.csproj

        # Load mock data
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "MediPulse@2024!Dev" -i MockData_InsertOnly.sql -d MedipulseMain

    - name: Validate mock data integrity
      if: always()
      run: |
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "MediPulse@2024!Dev" -i Scripts/validate_mock_data.sql -d MedipulseMain
        ERRORLEVEL=$($?)
        if [ $ERRORLEVEL -ne 0 ]; then
          echo "Mock data validation failed"
          exit 1
        fi
        echo "Mock data validation passed"

  frontend-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'Frontend/package-lock.json'
    
    - name: Install dependencies
      run: npm ci
      working-directory: Frontend

    - name: Audit frontend dependencies
      run: npm audit --audit-level=high
      working-directory: Frontend
    
    - name: TypeScript type checking
      run: npx tsc --noEmit
      working-directory: Frontend

    - name: Lint code
      run: npm run lint
      working-directory: Frontend
    
    - name: Build Angular app
      run: npm run build
      working-directory: Frontend
