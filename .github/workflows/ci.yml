name: CI/CD Pipeline

on:
  push:
    branches:
      - dev2
      - chore/improve-code-quality
      - main
  pull_request:
    branches:
      - dev2
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore --use-lock-file

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Verify .NET formatting
      run: dotnet format --verify-no-changes

    - name: Run unit tests with coverage
      run: dotnet test --no-build --verbosity normal --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:CoverletOutput=../TestResults/coverage.opencover.xml

- name: Report test coverage
      run: |
        # Install reportgenerator to convert opencover to human-readable format
        dotnet tool install --global dotnet-reportgenerator-globaltool
        # Generate coverage report
        reportgenerator "-reports:../TestResults/coverage.opencover.xml" "-targetdir:../TestResults/CoverageReport" "-reporttypes:HtmlSummary"
        # Extract coverage percentage from summary
        COVERAGE_PERCENT=$(grep -oP '(?<=Lines covered\: ).*(?=%)' ../TestResults/CoverageReport/Summary.txt | head -1)
        echo "Coverage: $COVERAGE_PERCENT%"
        # Check if coverage is below 40%
        if (( $(echo "$COVERAGE_PERCENT < 40" | bc -l) )); then
          echo "Error: Coverage is below 40%"
          exit 1
        fi
        echo "Coverage gate passed: $COVERAGE_PERCENT% >= 40%"

    - name: Start dependent services
      if: always()
      run: |
        docker compose -f docker-compose.yml up -d sqlserver
        # Wait for SQL Server to be ready
        for i in {1..30}; do
          if docker compose exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "${{ secrets.SA_PASSWORD }}" -Q "SELECT 1" 2>/dev/null; then
            echo "SQL Server is ready"
            break
          fi
          echo "Waiting for SQL Server to start..."
          sleep 2
        done

    - name: Apply migrations and load mock data
      if: always()
      run: |
        # Run EF Core migrations using the migrator service
        docker compose -f docker-compose.yml up migrator --abort-on-container-exit --exit-code-from migrator
        migrator_exit_code=$?
        if [ $migrator_exit_code -ne 0 ]; then
          echo "Migrations failed with exit code: $migrator_exit_code"
          exit $migrator_exit_code
        fi
        echo "Migrations completed successfully"

    - name: Validate mock data integrity
      if: always()
      run: |
        RESULT=$(docker compose exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "${{ secrets.SA_PASSWORD }}" -i Scripts/validate_mock_data.sql -d MedipulseMain -h -1 | tail -n 1)
        if [ "$RESULT" -gt 0 ]; then
          echo "Mock data validation failed with $RESULT errors"
          exit 1
        fi
        echo "Mock data validation passed"

  frontend-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'Frontend/package-lock.json'
    
    - name: Install dependencies
      run: npm ci
      working-directory: Frontend

    - name: Audit frontend dependencies
      run: npm audit --audit-level=high
      working-directory: Frontend
    
    - name: TypeScript type checking
      run: npx tsc --noEmit
      working-directory: Frontend

    - name: Lint code
      run: npm run lint
      working-directory: Frontend
    
    - name: Build Angular app
      run: npm run build
      working-directory: Frontend
