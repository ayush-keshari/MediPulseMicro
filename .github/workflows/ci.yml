name: CI/CD Pipeline

on:
  push:
    branches:
      - dev2
      - chore/improve-code-quality
      - main
  pull_request:
    branches:
      - dev2
      - main

jobs:
  # Backend build job - validates that the backend solution builds successfully
  backend_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Backend.slnx --use-lock-file

      - name: Verify NuGet lockfiles
        shell: bash
        run: |
          missing=0
          while IFS= read -r project; do
            lockfile="$(dirname "$project")/packages.lock.json"
            if [ ! -f "$lockfile" ]; then
              echo "Missing lockfile for $project"
              missing=1
            fi
          done < <(find . -name '*.csproj' -not -path '*/obj/*' -not -path '*/bin/*')
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Every project has a packages.lock.json"

      - name: Build solution
        run: dotnet build Backend.slnx --no-restore --configuration Release

  # Frontend build job - validates that the frontend builds successfully
  frontend_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: Frontend

      - name: Build Angular app
        run: npm run build
        working-directory: Frontend

  # Backend test job - runs unit tests, coverage, formatting, and vulnerability checks
  backend_test:
    runs-on: ubuntu-latest
    needs: [backend_build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Backend.slnx --use-lock-file

      - name: Build solution
        run: dotnet build Backend.slnx --no-restore --configuration Release

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable || echo "No vulnerable packages check completed"

      - name: Install dotnet-format
        run: dotnet tool install --global dotnet-format

      - name: Verify .NET formatting
        run: dotnet format Backend.slnx --verify-no-changes

      - name: Run unit tests with coverage
        run: |
          dotnet test Backend.slnx --no-build --verbosity normal --configuration Release \
            --collect:"XPlat Code Coverage"

      - name: Report test coverage
        run: |
          # Install reportgenerator to convert cobertura to human-readable format
          dotnet tool install --global dotnet-reportgenerator-globaltool
          # Generate coverage report
          reportgenerator "-reports:**/TestResults/**/coverage.cobertura.xml" "-targetdir:../TestResults/CoverageReport" "-reporttypes:TextSummary"
          # Extract coverage percentage from summary
          COVERAGE_PERCENT=$(awk '/Line coverage:/ {gsub(/%/, ""); print $NF}' ../TestResults/CoverageReport/Summary.txt)
          echo "Coverage: $COVERAGE_PERCENT%"
          # Keep the gate above the current repository baseline while coverage grows.
          if [ "$(awk -v cov="$COVERAGE_PERCENT" 'BEGIN {print (cov < 20)}')" -eq 1 ]; then
            echo "Error: Coverage is below the required baseline"
            exit 1
          fi
          echo "Coverage gate passed: $COVERAGE_PERCENT% >= 20%"

  # Frontend test job - runs unit tests, linting, type checking, and vulnerability checks
  frontend_test:
    runs-on: ubuntu-latest
    needs: [frontend_build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: Frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: Frontend

      - name: Run frontend unit tests
        run: npm test -- --watch=false
        working-directory: Frontend

      - name: TypeScript type checking
        run: npm run typecheck
        working-directory: Frontend

      - name: Lint code
        run: npm run lint
        working-directory: Frontend

      - name: Build Angular app (to ensure build works)
        run: npm run build
        working-directory: Frontend

  # Integration and data quality job - runs migrations and data quality checks against SQL Server
  integration_and_data_quality:
    runs-on: ubuntu-latest
    needs: [backend_build]  # Ensure backend builds successfully before running integration tests
    env:
      SA_PASSWORD: ${{ secrets.SA_PASSWORD || 'MediPulse@2024!Dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Wait for SQL Server to be ready
        run: |
          docker compose -f docker-compose.yml up -d sqlserver
          for i in {1..30}; do
            if docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U SA -P "$SA_PASSWORD" -Q "SELECT 1" 2>/dev/null; then
              echo "SQL Server is ready"
              break
            fi
            echo "Waiting for SQL Server to start..."
            sleep 2
          done
          docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U SA -P "$SA_PASSWORD" -Q "SELECT 1"

      - name: Apply migrations and load mock data
        run: |
          # Run EF Core migrations using the migrator service
          docker compose -f docker-compose.yml up migrator --abort-on-container-exit --exit-code-from migrator
          docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U SA -P "$SA_PASSWORD" -i /dev/stdin -d MedipulseMain < MockData_InsertOnly.sql
          docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U SA -P "$SA_PASSWORD" -i /dev/stdin -d MedipulseMain < Scripts/mockdata/AuthService.sql
          docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U SA -P "$SA_PASSWORD" -i /dev/stdin -d MedipulseMain < Scripts/mockdata/NotificationService.sql
          docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U SA -P "$SA_PASSWORD" -i /dev/stdin -d MedipulseAudit < Scripts/mockdata/AuditService.sql
          echo "Migrations completed successfully"

      - name: Validate mock data integrity
        run: |
          RESULT=$(docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U SA -P "$SA_PASSWORD" -i /dev/stdin -d MedipulseMain -h -1 < Scripts/validate_mock_data.sql | tail -n 1)
          if [ "$RESULT" -gt 0 ]; then
            echo "Mock data validation failed with $RESULT errors"
            exit 1
          fi
          echo "Mock data validation passed"

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc >/dev/null
          curl -sSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install dbt SQL Server adapter
        run: |
          python -m pip install --upgrade pip
          pip install -r pipelines/dbt/requirements.txt

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          mediapulse_dq:
            target: ci
            outputs:
              ci:
                type: sqlserver
                driver: ODBC Driver 18 for SQL Server
                server: localhost
                database: MedipulseMain
                schema: dbo
                username: sa
                password: $SA_PASSWORD
                port: 1433
                encrypt: true
                trust_cert: true
          EOF

      - name: Run dbt data quality tests
        working-directory: pipelines/dbt
        run: dbt test --no-partial-parse
