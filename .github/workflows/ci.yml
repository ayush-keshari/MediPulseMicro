name: CI/CD Pipeline

on:
  push:
    branches:
      - dev2
      - chore/improve-code-quality
      - main
  pull_request:
    branches:
      - dev2
      - main

jobs:
  # Fast unit-test job - runs without external dependencies
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Validate lockfiles are present
      run: |
        LOCKFILES=(
          "AuditService/packages.lock.json"
          "AuthService/packages.lock.json"
          "FacilityService/packages.lock.json"
          "Gateway/packages.lock.json"
          "InventoryService/packages.lock.json"
          "LogisticsService/packages.lock.json"
          "NotificationService/packages.lock.json"
          "ProcurementService/packages.lock.json"
          "TelemetryService/packages.lock.json"
          "Shared/packages.lock.json"
        )
        for lockfile in "${LOCKFILES[@]}"; do
          if [ ! -f "$lockfile" ]; then
            echo "Error: Lockfile $lockfile is missing"
            exit 1
          fi
        done
        echo "All lockfiles are present"

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore --use-lock-file

    - name: Check for vulnerable packages
      run: dotnet list package --vulnerable || echo "No vulnerable packages check completed"

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Install dotnet-format
      run: dotnet tool install --global dotnet-format

    - name: Verify .NET formatting
      run: dotnet format --verify-no-changes

    - name: Run unit tests with coverage
      run: |
        dotnet test --no-build --verbosity normal --configuration Release `
          /p:CollectCoverage=true `
          /p:CoverletOutputFormat=opencover `
          /p:CoverletOutput=../TestResults/coverage.opencover.xml

    - name: Report test coverage
      run: |
        # Install reportgenerator to convert opencover to human-readable format
        dotnet tool install --global dotnet-reportgenerator-globaltool
        # Generate coverage report
        reportgenerator "-reports:../TestResults/coverage.opencover.xml" "-targetdir:../TestResults/CoverageReport" "-reporttypes:HtmlSummary"
        # Extract coverage percentage from summary
        COVERAGE_PERCENT=$(awk '/Lines covered:/ {gsub(/%/, ""); print $NF}' ../TestResults/CoverageReport/Summary.txt)
        echo "Coverage: $COVERAGE_PERCENT%"
        # Check if coverage is below 60% using awk
        if [ "$(awk -v cov="$COVERAGE_PERCENT" 'BEGIN {print (cov < 60)}')" -eq 1 ]; then
          echo "Error: Coverage is below 60%"
          exit 1
        fi
        echo "Coverage gate passed: $COVERAGE_PERCENT% >= 60%"

  # Frontend build job - runs without external dependencies
  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'Frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci
      working-directory: Frontend

    - name: Audit frontend dependencies
      run: npm audit --audit-level=high
      working-directory: Frontend

    - name: TypeScript type checking
      run: npx tsc --noEmit
      working-directory: Frontend

    - name: Lint code
      run: npm run lint
      working-directory: Frontend

    - name: Build Angular app
      run: npm run build
      working-directory: Frontend

  # Integration job - requires Docker and SQL Server
  integration-validation:
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-build]  # Runs after unit tests and frontend build pass
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P $SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Wait for SQL Server to be ready
      run: |
        for i in {1..30}; do
          if docker compose -f docker-compose.yml exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "${{ secrets.SA_PASSWORD }}" -Q "SELECT 1" 2>/dev/null; then
            echo "SQL Server is ready"
            break
          fi
          echo "Waiting for SQL Server to start..."
          sleep 2
        done

    - name: Apply migrations and load mock data
      run: |
        # Run EF Core migrations using the migrator service
        docker compose -f docker-compose.yml up migrator --abort-on-container-exit --exit-code-from migrator
        migrator_exit_code=$?
        if [ $migrator_exit_code -ne 0 ]; then
          echo "Migrations failed with exit code: $migrator_exit_code"
          exit $migrator_exit_code
        fi
        echo "Migrations completed successfully"

    - name: Validate mock data integrity
      run: |
        RESULT=$(docker compose -f docker-compose.yml exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "${{ secrets.SA_PASSWORD }}" -i Scripts/validate_mock_data.sql -d MedipulseMain -h -1 | tail -n 1)
        if [ "$RESULT" -gt 0 ]; then
          echo "Mock data validation failed with $RESULT errors"
          exit 1
        fi
        echo "Mock data validation passed"

    - name: Run data quality checks on MedipulseMain
      run: |
        EXIT_CODE=0
        for sqlfile in Scripts/DQ/*.sql; do
          # Skip AuditService.sql as it runs against MedipulseAudit
          if [[ "$sqlfile" == *"AuditService.sql" ]]; then
            continue
          fi
          echo "Running $sqlfile against MedipulseMain..."
          RESULT=$(docker compose -f docker-compose.yml exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "${{ secrets.SA_PASSWORD }}" -i "$sqlfile" -d MedipulseMain -h -1 | tail -n 1)
          if [ "$RESULT" -gt 0 ]; then
            echo "Data quality check failed in $(basename "$sqlfile") with $RESULT error(s)"
            EXIT_CODE=1
          else
            echo "Data quality check passed in $(basename "$sqlfile")"
          fi
        done
        if [ $EXIT_CODE -ne 0 ]; then
          exit $EXIT_CODE
        fi
        echo "All MedipulseMain data quality checks passed"

    - name: Run data quality check on MedipulseAudit
      run: |
        echo "Running Scripts/DQ/AuditService.sql against MedipulseAudit..."
        RESULT=$(docker compose -f docker-compose.yml exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "${{ secrets.SA_PASSWORD }}" -i Scripts/DQ/AuditService.sql -d MedipulseAudit -h -1 | tail -n 1)
        if [ "$RESULT" -gt 0 ]; then
          echo "Data quality check failed in AuditService.sql with $RESULT error(s)"
          exit 1
        fi
        echo "Data quality check passed in AuditService.sql"

  # Data quality job - runs dbt tests against the migrated database
  data-quality:
    runs-on: ubuntu-latest
    needs: [integration-validation]  # runs after DB is seeded
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P $SA_PASSWORD -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dbt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core dbt-sqlserver

      - name: Write dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          mediapulse_dq:
            target: ci
            outputs:
              ci:
                type: sqlserver
                driver: ODBC Driver 17 for SQL Server
                server: sqlserver
                database: MedipulseMain
                schema: dbo
                username: sa
                password: ${{ secrets.SA_PASSWORD }}
                port: 1433
                encrypt: true
                trust_server_certificate: true
          EOF

      - name: Install dbt project dependencies
        working-directory: ./pipelines/dbt
        run: dbt deps

      - name: Run dbt tests
        working-directory: ./pipelines/dbt
        run: dbt test