name: CI/CD Pipeline

on:
  push:
    branches:
      - dev2
      - chore/improve-code-quality
      - main
  pull_request:
    branches:
      - dev2
      - main

jobs:
  # Backend build job - validates that the backend solution builds successfully
  backend_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Backend.slnx --use-lock-file

      - name: Build solution
        run: dotnet build Backend.slnx --no-restore --configuration Release

  # Frontend build job - validates that the frontend builds successfully
  frontend_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: Frontend

      - name: Build Angular app
        run: npm run build
        working-directory: Frontend

  # Backend test job - runs unit tests, coverage, formatting, and vulnerability checks
  backend_test:
    runs-on: ubuntu-latest
    needs: [backend_build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Backend.slnx --use-lock-file

      - name: Build solution
        run: dotnet build Backend.slnx --no-restore --configuration Release

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable || echo "No vulnerable packages check completed"

      - name: Install dotnet-format
        run: dotnet tool install --global dotnet-format

      - name: Verify .NET formatting
        run: dotnet format Backend.slnx --verify-no-changes

      - name: Run unit tests with coverage
        run: |
          dotnet test Backend.slnx --no-build --verbosity normal --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=../TestResults/coverage.cobertura.xml

      - name: Report test coverage
        run: |
          # Install reportgenerator to convert cobertura to human-readable format
          dotnet tool install --global dotnet-reportgenerator-globaltool
          # Generate coverage report
          reportgenerator "-reports:../TestResults/coverage.cobertura.xml" "-targetdir:../TestResults/CoverageReport" "-reporttypes:TextSummary"
          # Extract coverage percentage from summary
          COVERAGE_PERCENT=$(awk '/Line coverage:/ {gsub(/%/, ""); print $NF}' ../TestResults/CoverageReport/Summary.txt)
          echo "Coverage: $COVERAGE_PERCENT%"
          # Check if coverage is below 60% using awk
          if [ "$(awk -v cov="$COVERAGE_PERCENT" 'BEGIN {print (cov < 60)}')" -eq 1 ]; then
            echo "Error: Coverage is below 60%"
            exit 1
          fi
          echo "Coverage gate passed: $COVERAGE_PERCENT% >= 60%"

  # Frontend test job - runs unit tests, linting, type checking, and vulnerability checks
  frontend_test:
    runs-on: ubuntu-latest
    needs: [frontend_build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.1'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: Frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: Frontend

      - name: TypeScript type checking
        run: npx tsc --noEmit
        working-directory: Frontend

      - name: Lint code
        run: npm run lint
        working-directory: Frontend

      - name: Build Angular app (to ensure build works)
        run: npm run build
        working-directory: Frontend

  # Integration and data quality job - runs migrations and data quality checks against SQL Server
  integration_and_data_quality:
    runs-on: ubuntu-latest
    needs: [backend_build]  # Ensure backend builds successfully before running integration tests
    env:
      SA_PASSWORD: ${{ secrets.SA_PASSWORD || 'MediPulse@2024!Dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Wait for SQL Server to be ready
        run: |
          docker compose -f docker-compose.yml up -d sqlserver
          for i in {1..30}; do
            if docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P "$SA_PASSWORD" -Q "SELECT 1" 2>/dev/null; then
              echo "SQL Server is ready"
              break
            fi
            echo "Waiting for SQL Server to start..."
            sleep 2
          done
          docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P "$SA_PASSWORD" -Q "SELECT 1"

      - name: Apply migrations and load mock data
        run: |
          # Run EF Core migrations using the migrator service
          docker compose -f docker-compose.yml up migrator --abort-on-container-exit --exit-code-from migrator
          echo "Migrations completed successfully"

      - name: Validate mock data integrity
        run: |
          RESULT=$(docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P "$SA_PASSWORD" -i /dev/stdin -d MedipulseMain -h -1 < Scripts/validate_mock_data.sql | tail -n 1)
          if [ "$RESULT" -gt 0 ]; then
            echo "Mock data validation failed with $RESULT errors"
            exit 1
          fi
          echo "Mock data validation passed"

      - name: Run data quality checks on MedipulseMain
        run: |
          EXIT_CODE=0
          for sqlfile in Scripts/DQ/*.sql; do
            # Skip AuditService.sql as it runs against MedipulseAudit
            if [[ "$sqlfile" == *"AuditService.sql" ]]; then
              continue
            fi
            echo "Running $sqlfile against MedipulseMain..."
            RESULT=$(docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P "$SA_PASSWORD" -i /dev/stdin -d MedipulseMain -h -1 < "$sqlfile")
            if echo "$RESULT" | jq -e 'any(.Checks[]; .Status != 0)' >/dev/null; then
              echo "Data quality check failed in $(basename "$sqlfile")"
              EXIT_CODE=1
            else
              echo "Data quality check passed in $(basename "$sqlfile")"
            fi
          done
          if [ $EXIT_CODE -ne 0 ]; then
            exit $EXIT_CODE
          fi
          echo "All MedipulseMain data quality checks passed"

      - name: Run data quality check on MedipulseAudit
        run: |
          echo "Running Scripts/DQ/AuditService.sql against MedipulseAudit..."
          RESULT=$(docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U SA -P "$SA_PASSWORD" -i /dev/stdin -d MedipulseAudit -h -1 < Scripts/DQ/AuditService.sql)
          if echo "$RESULT" | jq -e 'any(.Checks[]; .Status != 0)' >/dev/null; then
            echo "Data quality check failed in AuditService.sql"
            exit 1
          fi
          echo "Data quality check passed in AuditService.sql"
