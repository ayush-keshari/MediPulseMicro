name: Scheduled DBT Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  dbt-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run isolated quality pipeline
        run: python pipelines/dbt/run_pipeline.py

      - name: Publish quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-test-results
          path: pipelines/dbt/target/pipeline/
          if-no-files-found: error
          retention-days: 7
