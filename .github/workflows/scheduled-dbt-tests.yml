name: Scheduled DBT Tests

# Run the workflow on a schedule
on:
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  dbt-tests:
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: ${{ secrets.SA_PASSWORD || 'MediPulse@2024!Dev' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Wait for SQL Server to be ready
      run: |
        docker compose -f docker-compose.yml up -d sqlserver
        for i in {1..30}; do
          if docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "$SA_PASSWORD" -Q "SELECT 1" 2>/dev/null; then
            echo "SQL Server is ready"
            break
          fi
          echo "Waiting for SQL Server to start..."
          sleep 2
        done
        docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "$SA_PASSWORD" -Q "SELECT 1"

    - name: Apply migrations and load mock data
      run: |
        # Run EF Core migrations using the migrator service
        docker compose -f docker-compose.yml up migrator --abort-on-container-exit --exit-code-from migrator
        migrator_exit_code=$?
        if [ $migrator_exit_code -ne 0 ]; then
          echo "Migrations failed with exit code: $migrator_exit_code"
          exit $migrator_exit_code
        fi
        echo "Migrations completed successfully"

    - name: Validate mock data integrity
      run: |
        RESULT=$(docker compose -f docker-compose.yml exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P "$SA_PASSWORD" -i /dev/stdin -d MedipulseMain -h -1 < Scripts/validate_mock_data.sql | tail -n 1)
        if [ "$RESULT" -gt 0 ]; then
          echo "Mock data validation failed with $RESULT errors"
          exit 1
        fi
        echo "Mock data validation passed"

    - name: Install dbt dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dbt-core dbt-sqlserver

    - name: Write dbt profile
      run: |
        mkdir -p ~/.dbt
        cat > ~/.dbt/profiles.yml <<EOF
        mediapulse_dq:
          target: ci
          outputs:
            ci:
              type: sqlserver
              driver: ODBC Driver 17 for SQL Server
              server: localhost
              database: MedipulseMain
              schema: dbo
              username: sa
              password: ${{ secrets.SA_PASSWORD }}
              port: 1433
              encrypt: true
              trust_server_certificate: true
        EOF

    - name: Install dbt project dependencies
      working-directory: ./pipelines/dbt
      run: dbt deps

    - name: Run dbt tests
      working-directory: ./pipelines/dbt
      run: dbt test

    - name: Publish Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dbt-test-results
        path: ./pipelines/dbt/target/
